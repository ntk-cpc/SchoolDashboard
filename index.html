<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🏫 教師儀表板</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            overflow: hidden;
        }

        body {
            background: #0a0e17;
            font-family: -apple-system, 'Helvetica Neue', 'PingFang HK', 'Segoe UI', sans-serif;
            color: #eef3f9;
            padding: 8px 10px;
            display: flex;
            align-items: flex-start;
            justify-content: center;
        }

        .app-container {
            max-width: 1440px;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        /* ===== 卡片 ===== */
        .card {
            background: linear-gradient(145deg, #141c2a, #0e1520);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            padding: 8px 10px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        .card-title {
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.2px;
            display: flex;
            align-items: center;
            gap: 6px;
            padding-bottom: 4px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            flex-shrink: 0;
            color: #b0c8e0;
        }

        .card-title .badge {
            font-size: 9px;
            font-weight: 400;
            color: #4f6a8a;
            margin-left: auto;
            background: rgba(255, 255, 255, 0.04);
            padding: 0 10px;
            border-radius: 30px;
        }

        /* ===== 頂部（壓縮） ===== */
        .top-bar {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 6px;
            margin-bottom: 6px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            gap: 6px;
            flex-shrink: 0;
        }

        .top-bar h1 {
            font-size: 17px;
            font-weight: 700;
            color: #5b9cff;
        }

        .top-bar .time {
            font-size: 12px;
            color: #5b7a9c;
        }

        .top-stats {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .top-stats .stat {
            background: rgba(255, 255, 255, 0.04);
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 10px;
            text-align: center;
            line-height: 1.3;
        }

        .top-stats .stat .label {
            color: #5b7a9c;
            font-size: 8px;
            display: block;
        }

        .top-stats .stat .value {
            font-weight: 700;
            font-size: 13px;
        }

        .stat-amber .value { color: #f5b342; }
        .stat-emerald .value { color: #4fcf8a; }
        .stat-sky .value { color: #5bb8ff; }

        /* ===== 主網格（填滿剩餘高度） ===== */
        .main-grid {
            flex: 1;
            display: grid;
            grid-template-columns: 5fr 4fr 3fr;
            gap: 6px;
            min-height: 0;
        }

        /* ===== 課表（字體適中） ===== */
        .schedule-scroll {
            overflow-y: auto;
            flex: 1;
            min-height: 0;
        }

        .schedule-scroll::-webkit-scrollbar {
            width: 3px;
        }
        .schedule-scroll::-webkit-scrollbar-thumb {
            background: #2a3f5a;
            border-radius: 10px;
        }

        .sch-table {
            width: 100%;
            font-size: 13px;
            border-collapse: collapse;
        }

        .sch-table thead th {
            text-align: left;
            padding: 3px 4px;
            font-size: 9px;
            text-transform: uppercase;
            color: #4f6a8a;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            font-weight: 600;
        }

        .sch-table tbody td {
            padding: 3px 4px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.02);
            color: #dce8f5;
            font-size: 13px;
            line-height: 1.3;
        }

        .sch-table tbody tr.now td {
            background: rgba(45, 140, 255, 0.08);
            border-left: 3px solid #3b8cff;
        }

        .sch-table tbody tr.now td:first-child {
            padding-left: 1px;
        }

        .sch-table tbody tr.break td {
            color: #a08a5a;
        }
        .sch-table tbody tr.lunch td {
            color: #5fc98a;
        }

        .sch-table .period {
            font-weight: 600;
            color: #5b7a9c;
            font-size: 11px;
            width: 28px;
        }
        .sch-table .time-col {
            font-family: monospace;
            font-size: 10px;
            color: #4f8fc0;
            width: 75px;
        }

        /* ===== 穿梭巴士 ===== */
        .shuttle-wrapper {
            flex: 1;
            min-height: 0;
            border-radius: 8px;
            overflow: hidden;
            background: #0d1420;
            border: 1px solid rgba(255, 255, 255, 0.05);
            position: relative;
        }

        .shuttle-wrapper iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        .shuttle-wrapper::after {
            content: '';
            position: absolute;
            inset: 0;
            pointer-events: none;
            background: rgba(10, 14, 23, 0.08);
            mix-blend-mode: multiply;
        }

        /* ===== 事務 ===== */
        .item-list {
            overflow-y: auto;
            flex: 1;
            min-height: 0;
        }

        .item-list::-webkit-scrollbar {
            width: 2px;
        }
        .item-list::-webkit-scrollbar-thumb {
            background: #2a3f5a;
            border-radius: 10px;
        }

        .list-item {
            padding: 4px 8px;
            border-radius: 5px;
            margin-bottom: 2px;
            font-size: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.02);
            border-left: 3px solid #4f6a8a;
            line-height: 1.3;
        }

        .list-item.hw { border-left-color: #f472b6; }
        .list-item.dl { border-left-color: #fbbf24; }
        .list-item.mtg { border-left-color: #a78bfa; }

        .empty-state {
            color: #4f6a8a;
            font-size: 12px;
            padding: 4px 0;
            text-align: center;
        }

        .section-label {
            font-size: 11px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 4px;
            flex-shrink: 0;
            padding: 2px 0;
        }

        .section-label:first-of-type {
            padding-top: 0;
        }

        /* 事務區塊 - 用 flex 均分 */
        .tasks-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
        }

        .tasks-area .task-block {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
        }

        .tasks-area .task-block:not(:last-child) {
            margin-bottom: 2px;
        }

        /* ===== 底部 ===== */
        .footer-bar {
            flex-shrink: 0;
            margin-top: 4px;
            padding-top: 4px;
            border-top: 1px solid rgba(255, 255, 255, 0.03);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 10px;
            color: #3f5a7a;
        }

        .footer-bar .dot {
            display: inline-block;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #3bc96a;
            margin-right: 4px;
            animation: pulse-dot 2s infinite;
        }

        @keyframes pulse-dot {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .footer-bar button {
            background: rgba(255, 255, 255, 0.05);
            border: none;
            color: #5b7a9c;
            padding: 1px 14px;
            border-radius: 30px;
            font-size: 10px;
            cursor: pointer;
            transition: 0.2s;
        }
        .footer-bar button:hover {
            background: rgba(255, 255, 255, 0.10);
        }

        /* ===== 響應式：細 Mon 再縮 ===== */
        @media (max-width: 820px) {
            body { padding: 5px 6px; }
            .card { padding: 5px 6px; border-radius: 8px; }
            .top-bar h1 { font-size: 14px; }
            .top-bar .time { font-size: 10px; }
            .top-stats .stat .value { font-size: 11px; }
            .main-grid { gap: 4px; }
            .sch-table { font-size: 11px; }
            .sch-table tbody td { font-size: 11px; padding: 2px 3px; }
            .sch-table .period { font-size: 9px; width: 22px; }
            .sch-table .time-col { font-size: 9px; width: 60px; }
            .list-item { font-size: 10px; padding: 2px 6px; }
            .empty-state { font-size: 10px; }
            .section-label { font-size: 10px; }
            .card-title { font-size: 11px; }
            .footer-bar { font-size: 9px; }
        }

        @media (max-width: 640px) {
            .main-grid {
                grid-template-columns: 1fr;
                grid-template-rows: auto auto auto;
            }
            .card { min-height: 120px; }
        }
    </style>
</head>
<body>

<div class="app-container">

    <!-- ====== 頂部 ====== -->
    <div class="top-bar">
        <div>
            <h1>🏫 教師儀表板</h1>
            <span class="time" id="system-time">載入中...</span>
        </div>
        <div class="top-stats">
            <div class="stat stat-amber">
                <span class="label">Cycle</span>
                <span class="value" id="cycle-day">--</span>
            </div>
            <div class="stat stat-emerald">
                <span class="label">模式</span>
                <span class="value" id="school-mode">--</span>
            </div>
            <div class="stat stat-sky">
                <span class="label">活動</span>
                <span class="value" id="school-note">--</span>
            </div>
        </div>
    </div>

    <!-- ====== 主網格：3 欄 ====== -->
    <div class="main-grid">

        <!-- 欄 1：課表 -->
        <div class="card">
            <div class="card-title">
                📅 今日課表
                <span class="badge" id="current-date-display">--</span>
            </div>
            <div class="schedule-scroll">
                <table class="sch-table">
                    <thead>
                        <tr>
                            <th>節</th>
                            <th>時間</th>
                            <th>課堂資訊</th>
                        </tr>
                    </thead>
                    <tbody id="schedule-body">
                        <tr><td colspan="3" class="text-center text-slate-500 py-2">⏳ 載入中...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- 欄 2：事務 -->
        <div class="card">
            <div class="card-title">
                📋 今日事務
                <span class="badge">總覽</span>
            </div>
            <div class="tasks-area">
                <!-- 功課 -->
                <div class="task-block">
                    <div class="section-label" style="color: #f472b6;">📚 功課</div>
                    <div class="item-list" id="homework-container">
                        <div class="empty-state">今日無功課紀錄</div>
                    </div>
                </div>
                <!-- Deadline -->
                <div class="task-block">
                    <div class="section-label" style="color: #fbbf24;">⏳ 文件 Deadline</div>
                    <div class="item-list" id="deadline-container">
                        <div class="empty-state">今日無截止需求</div>
                    </div>
                </div>
                <!-- 會議 -->
                <div class="task-block" style="flex: 0 0 auto;">
                    <div class="section-label" style="color: #a78bfa;">📌 今日會議</div>
                    <div id="meetings-container">
                        <div class="empty-state" style="padding: 2px 0;">今日無會議</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 欄 3：穿梭巴士 -->
        <div class="card">
            <div class="card-title">
                🚐 屋苑穿梭巴士
                <span class="badge">即時</span>
            </div>
            <div class="shuttle-wrapper">
                <iframe src="https://eta-app.socif.co/sunbus?site=gds&lang=zh"
                        sandbox="allow-scripts allow-same-origin allow-popups allow-forms">
                </iframe>
            </div>
        </div>
    </div>

    <!-- ====== 底部 ====== -->
    <div class="footer-bar">
        <span><span class="dot"></span>系統正常 · 自動更新</span>
        <span id="footer-clock">--:--:--</span>
        <button onclick="refreshAll()">⟳ 重新整理</button>
    </div>

</div>

<!-- ========================================================== -->
<script>
    const GOOGLE_API_URL = "https://script.google.com/macros/s/AKfycbw_bgy080wFKf3iybNhFDc0LBHmb0-84-fifMqF2P_50PUncokrrnk9mgr5w3jNawBR/exec";

    function updateClock() {
        const now = new Date();
        document.getElementById("system-time").textContent = now.toLocaleString("zh-HK", {
            year: 'numeric', month: '2-digit', day: '2-digit',
            hour: '2-digit', minute: '2-digit', second: '2-digit',
            hour12: false
        });
        document.getElementById("footer-clock").textContent =
            now.toLocaleTimeString("zh-HK", { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    }
    setInterval(updateClock, 1000);
    updateClock();

    async function fetchDashboardData() {
        try {
            const response = await fetch(GOOGLE_API_URL, { redirect: "follow" });
            const data = await response.json();

            document.getElementById("current-date-display").textContent =
                data.date + " (" + data.weekday + ")";
            document.getElementById("cycle-day").textContent = data.cycleDay || "--";
            document.getElementById("school-mode").textContent = data.mode || "全日";
            document.getElementById("school-note").textContent = data.note || "無特別活動";

            // ---- 課表 ----
            const tbody = document.getElementById("schedule-body");
            tbody.innerHTML = "";
            if (data.schedule && data.schedule.length > 0) {
                const now = new Date();
                const currentMin = now.getHours() * 60 + now.getMinutes();

                data.schedule.forEach(item => {
                    const tr = document.createElement("tr");
                    let extraClass = "";
                    let isNow = false;

                    if (item.info && item.info.includes("小息")) extraClass = "break";
                    else if (item.info && (item.info.includes("午膳") || item.info.includes("午睡"))) extraClass = "lunch";

                    if (item.time && item.time.includes('-')) {
                        const [start, end] = item.time.split('-');
                        const [sh, sm] = start.split(':').map(Number);
                        const [eh, em] = end.split(':').map(Number);
                        if (!isNaN(sh) && !isNaN(sm) && !isNaN(eh) && !isNaN(em)) {
                            const startMin = sh * 60 + sm;
                            const endMin = eh * 60 + em;
                            if (currentMin >= startMin && currentMin < endMin) isNow = true;
                        }
                    }

                    if (isNow) extraClass += " now";
                    if (extraClass) tr.className = extraClass.trim();

                    tr.innerHTML = `
                        <td class="period">${item.period || ''}</td>
                        <td class="time-col">${item.time || ''}</td>
                        <td>${item.info || ''}</td>
                    `;
                    tbody.appendChild(tr);
                });
            } else {
                tbody.innerHTML = `<tr><td colspan="3" class="text-center text-slate-500 py-2">今日無課堂</td></tr>`;
            }

            // ---- 功課 ----
            const hwBox = document.getElementById("homework-container");
            hwBox.innerHTML = "";
            if (data.homework && data.homework.length > 0) {
                data.homework.forEach(h => {
                    const div = document.createElement("div");
                    div.className = "list-item hw";
                    div.innerHTML = `
                        <span><span style="color:#f472b6;font-weight:600;">[${h.type}]</span> ${h.className} - ${h.title}</span>
                    `;
                    hwBox.appendChild(div);
                });
            } else {
                hwBox.innerHTML = `<div class="empty-state">今日無功課紀錄</div>`;
            }

            // ---- Deadline ----
            const dlBox = document.getElementById("deadline-container");
            dlBox.innerHTML = "";
            if (data.deadlines && data.deadlines.length > 0) {
                data.deadlines.forEach(d => {
                    const div = document.createElement("div");
                    div.className = "list-item dl";
                    div.innerHTML = `
                        <span>${d.item} <span style="color:#4f6a8a;font-size:10px;">(${d.dept})</span></span>
                        <span style="color:#fbbf24;font-weight:700;">${d.status}</span>
                    `;
                    dlBox.appendChild(div);
                });
            } else {
                dlBox.innerHTML = `<div class="empty-state">今日無截止需求</div>`;
            }

            // ---- 會議 ----
            const mBox = document.getElementById("meetings-container");
            mBox.innerHTML = "";
            if (data.meetings && data.meetings.length > 0) {
                data.meetings.forEach(m => {
                    const div = document.createElement("div");
                    div.className = "list-item mtg";
                    div.innerHTML = `
                        <span>${m.title} <span style="color:#4f6a8a;font-size:10px;">${m.remark || ''}</span></span>
                        <span style="color:#a78bfa;font-family:monospace;font-size:11px;">${m.start}-${m.end}</span>
                    `;
                    mBox.appendChild(div);
                });
            } else {
                mBox.innerHTML = `<div class="empty-state" style="padding:2px 0;">今日無會議</div>`;
            }

        } catch (err) {
            console.error("Google Sheets 同步失敗:", err);
        }
    }

    function refreshAll() {
        fetchDashboardData();
        updateClock();
        const iframe = document.querySelector('.shuttle-wrapper iframe');
        if (iframe) {
            const src = iframe.src;
            iframe.src = '';
            setTimeout(() => { iframe.src = src; }, 150);
        }
        console.log("✅ 儀表板已更新", new Date().toLocaleString());
    }

    fetchDashboardData();
    setInterval(fetchDashboardData, 60000);
    setInterval(updateClock, 1000);

    document.addEventListener("visibilitychange", () => {
        if (!document.hidden) refreshAll();
    });

    window.refreshAll = refreshAll;
    console.log("🏫 教師儀表板已啟動！");
</script>

</body>
</html>

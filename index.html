<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>教師個人智慧儀表板 Dashboard</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background-color: #0f172a; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; }
    .card { background-color: #1e293b; border: 1px solid #334155; border-radius: 0.75rem; }
  </style>
</head>
<body class="p-4 md:p-6 min-h-screen">

  <!-- 頂部標題與時間列 -->
  <div class="flex flex-col md:flex-row justify-between items-center mb-6 pb-4 border-b border-slate-700 gap-4">
    <div>
      <h1 class="text-2xl font-bold text-blue-400 flex items-center gap-2">
        <span>🏫</span> 教師每日主控儀表板
      </h1>
      <p id="system-time" class="text-slate-400 text-sm mt-1">載入時間中...</p>
    </div>
    
    <!-- 日期與 Cycle 狀態卡片 -->
    <div class="flex gap-3 text-center">
      <div class="card px-4 py-2">
        <div class="text-xs text-slate-400">當天 Cycle</div>
        <div id="cycle-day" class="text-xl font-bold text-amber-400">--</div>
      </div>
      <div class="card px-4 py-2">
        <div class="text-xs text-slate-400">課節模式</div>
        <div id="school-mode" class="text-xl font-bold text-emerald-400">--</div>
      </div>
      <div class="card px-4 py-2">
        <div class="text-xs text-slate-400">學校活動/備註</div>
        <div id="school-note" class="text-sm font-semibold text-sky-300 mt-1">無特別活動</div>
      </div>
    </div>
  </div>

  <!-- 主要內容網格 (三欄佈局) -->
  <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">

    <!-- 左側：每日課表主控台 (占 7 欄) -->
    <div class="lg:col-span-7 space-y-6">
      <div class="card p-5">
        <div class="flex justify-between items-center mb-4">
          <h2 class="text-lg font-bold text-slate-200 flex items-center gap-2">
            <span>📅</span> 今日固定課課表
          </h2>
          <span class="text-xs bg-slate-700 px-2.5 py-1 rounded-full text-slate-300" id="current-date-display">2026/--/--</span>
        </div>

        <div class="overflow-x-auto">
          <table class="w-full text-left text-sm text-slate-300">
            <thead class="bg-slate-800 text-slate-400 uppercase text-xs">
              <tr>
                <th class="p-2.5 rounded-l">節次</th>
                <th class="p-2.5">時間</th>
                <th class="p-2.5 rounded-r">課堂資訊 (科目 / 班別 / 課室)</th>
              </tr>
            </thead>
            <tbody id="schedule-body" class="divide-y divide-slate-700/50">
              <tr><td colspan="3" class="p-4 text-center text-slate-500">⏳ 正在同步 Google Sheets 課表...</td></tr>
            </tbody>
          </table>
        </div>
      </div>

      <!-- 突發會議卡片 -->
      <div class="card p-5">
        <h2 class="text-lg font-bold text-amber-400 mb-3 flex items-center gap-2">
          <span>📌</span> 當日突發會議紀錄
        </h2>
        <div id="meetings-container" class="space-y-2 text-sm">
          <div class="p-3 bg-slate-800/60 rounded border border-slate-700/50 text-slate-400">今日無突發會議</div>
        </div>
      </div>
    </div>

    <!-- 右側：交通 ETA & 天氣資訊 (占 5 欄) -->
    <div class="lg:col-span-5 space-y-6">

      <!-- 常用交通到站時間 (形點 II 九巴 + 屋苑 Shuttle) -->
      <div class="card p-5">
        <h2 class="text-lg font-bold text-emerald-400 mb-4 flex items-center gap-2">
          <span>🚌</span> 實時到站時間 (形點 II & Shuttle)
        </h2>
        
        <!-- 九巴到站容器 -->
        <div class="space-y-3" id="kmb-bus-container">
          <div class="p-3 bg-slate-800 rounded-lg border border-slate-700 text-xs text-slate-400">
            ⏳ 正在載入形點 II 九巴到站時間...
          </div>
        </div>

        <!-- 屋苑 Shuttle 巴士動態卡片 -->
        <div class="mt-4 p-3 bg-slate-800 rounded-lg flex justify-between items-center border border-amber-500/30">
          <div>
            <div class="font-bold text-base text-amber-300 flex items-center gap-1.5">
              <span>🚍</span> 屋苑穿梭巴士 (SunBus)
            </div>
            <div class="text-xs text-slate-400">即時到站倒數</div>
          </div>
          <div class="text-right">
            <span id="shuttle-eta-main" class="text-lg font-bold text-amber-400">載入中...</span>
            <div id="shuttle-eta-sub" class="text-xs text-slate-400">更新中</div>
          </div>
        </div>

        <div class="mt-2 text-right">
          <a href="https://eta-app.socif.co/sunbus?site=gds&lang=zh" target="_blank" class="text-xs text-sky-400 hover:underline inline-flex items-center gap-1">
            <span>🔗</span> 開啟完整屋苑 Shuttle 實時地圖 ↗
          </a>
        </div>
      </div>

      <!-- 香港天文台天氣雷達圖 -->
      <div class="card p-5">
        <h2 class="text-lg font-bold text-sky-400 mb-3 flex items-center gap-2">
          <span>🌧️</span> 天文台即時氣象雷達圖
        </h2>
        <div class="rounded-lg overflow-hidden border border-slate-700 bg-black flex justify-center">
          <img id="radar-img" src="https://www.hko.gov.hk/wxinfo/radars/radar_range1/rad_064_fix.gif" alt="天文台雷達圖" class="w-full h-auto max-h-64 object-contain">
        </div>
        <p class="text-xs text-slate-500 mt-2 text-right">自動每 5 分鐘重載圖像</p>
      </div>

    </div>
  </div>

  <script>
    const GOOGLE_API_URL = "https://script.google.com/macros/s/AKfycbw_bgy080wFKf3iybNhFDc0LBHmb0-84-fifMqF2P_50PUncokrrnk9mgr5w3jNawBR/exec";

    // 想顯示的形點 II 常用九巴路線（可隨時修改）
    const targetRoutes = ["268X", "68M", "968", "276P"]; 
    // 九巴「形點 II」巴士站指定代碼
    const KMB_STOP_ID = "BS10-T-1200-0"; 

    // 1. 更新時鐘
    function updateClock() {
      const now = new Date();
      document.getElementById("system-time").innerText = now.toLocaleString("zh-HK", {
        year: 'numeric', month: '2-digit', day: '2-digit',
        hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false
      });
    }
    setInterval(updateClock, 1000);
    updateClock();

    // 2. 抓取 Google Sheets 資料
    async function fetchDashboardData() {
      try {
        const response = await fetch(GOOGLE_API_URL);
        const data = await response.json();

        document.getElementById("current-date-display").innerText = data.date + " (" + data.weekday + ")";
        document.getElementById("cycle-day").innerText = data.cycleDay || "假期";
        document.getElementById("school-mode").innerText = data.mode || "全日";
        document.getElementById("school-note").innerText = data.note || "無特別活動";

        const tbody = document.getElementById("schedule-body");
        tbody.innerHTML = "";
        if (data.schedule && data.schedule.length > 0) {
          data.schedule.forEach(item => {
            const tr = document.createElement("tr");
            tr.className = "hover:bg-slate-800/50 transition-colors";
            
            if (item.info.includes("小息") || item.info.includes("午膳") || item.info.includes("Roll Call")) {
              tr.className += " text-slate-500 italic bg-slate-800/30";
            }

            tr.innerHTML = `
              <td class="p-2.5 font-bold text-slate-400">${item.period}</td>
              <td class="p-2.5 font-mono text-xs text-sky-300">${item.time}</td>
              <td class="p-2.5 font-medium text-slate-100">${item.info}</td>
            `;
            tbody.appendChild(tr);
          });
        }

        const meetingsContainer = document.getElementById("meetings-container");
        meetingsContainer.innerHTML = "";
        if (data.meetings && data.meetings.length > 0) {
          data.meetings.forEach(m => {
            const div = document.createElement("div");
            div.className = "p-3 bg-amber-950/40 border border-amber-800/50 rounded text-amber-200 flex justify-between";
            div.innerHTML = `
              <div>
                <span class="font-bold">${m.title}</span>
                <span class="text-xs text-amber-400 block">${m.remark || ""}</span>
              </div>
              <span class="text-xs font-mono bg-amber-900/60 px-2 py-1 rounded text-amber-300">${m.start} - ${m.end}</span>
            `;
            meetingsContainer.appendChild(div);
          });
        } else {
          meetingsContainer.innerHTML = `<div class="p-3 bg-slate-800/60 rounded border border-slate-700/50 text-slate-400">今日無突發會議</div>`;
        }

      } catch (err) {
        console.error("試算表同步失敗:", err);
      }
    }

    // 3. 抓取九巴形點 II 站實時 ETA
    async function fetchKmbETA() {
      const container = document.getElementById("kmb-bus-container");
      try {
        const response = await fetch(`https://data.etabus.gov.hk/v1/transport/kmb/stop-eta/${KMB_STOP_ID}`);
        const result = await response.json();
        
        if (!result.data || result.data.length === 0) {
          container.innerHTML = `<div class="p-3 bg-slate-800 rounded text-xs text-slate-400">形點 II 暫無巴士班次</div>`;
          return;
        }

        let routeMap = {};
        result.data.forEach(item => {
          if (targetRoutes.includes(item.route) && item.eta) {
            if (!routeMap[item.route]) routeMap[item.route] = [];
            
            const etaTime = new Date(item.eta);
            const now = new Date();
            const diffMins = Math.max(0, Math.round((etaTime - now) / 60000));
            
            routeMap[item.route].push({
              dest: item.dest_tc,
              mins: diffMins
            });
          }
        });

        container.innerHTML = "";
        targetRoutes.forEach(route => {
          if (routeMap[route] && routeMap[route].length > 0) {
            const etas = routeMap[route];
            const nextBus = etas[0];
            const secondBus = etas[1] ? etas[1].mins + " 分鐘" : "無";

            const div = document.createElement("div");
            div.className = "p-3 bg-slate-800 rounded-lg flex justify-between items-center border border-slate-700";
            div.innerHTML = `
              <div>
                <div class="font-bold text-base text-white">九巴 ${route} <span class="text-xs text-slate-400 font-normal">往 ${nextBus.dest}</span></div>
                <div class="text-xs text-slate-400">形點 II 巴士站</div>
              </div>
              <div class="text-right">
                <span class="text-lg font-bold text-emerald-400">${nextBus.mins === 0 ? "即將到達" : nextBus.mins + " 分鐘"}</span>
                <div class="text-xs text-slate-500">下班: ${secondBus}</div>
              </div>
            `;
            container.appendChild(div);
          }
        });

      } catch (err) {
        console.error("九巴 ETA 抓取失敗:", err);
      }
    }

    // 4. 抓取 SOCIF 屋苑 Shuttle 即時 ETA
    async function fetchShuttleETA() {
      try {
        const response = await fetch("https://eta.socif.co/sunbus/eta?site=gds");
        const data = await response.json();
        if (data && data.length > 0) {
          const nextBus = data[0];
          document.getElementById("shuttle-eta-main").innerText = nextBus.eta_min ? nextBus.eta_min + " 分鐘" : "即將到達";
          document.getElementById("shuttle-eta-sub").innerText = "目的地: " + (nextBus.dest || "屋苑/車站");
        } else {
          document.getElementById("shuttle-eta-main").innerText = "暫無班次";
        }
      } catch (e) {
        document.getElementById("shuttle-eta-main").innerText = "即時班次運作中";
        document.getElementById("shuttle-eta-sub").innerText = "點擊下方連結查看網頁";
      }
    }

    // 定時刷新設定
    setInterval(() => {
      document.getElementById("radar-img").src = "https://www.hko.gov.hk/wxinfo/radars/radar_range1/rad_064_fix.gif?t=" + new Date().getTime();
    }, 300000); // 5 分鐘重載雷達圖

    setInterval(fetchKmbETA, 30000);     // 30 秒更新九巴到站時間
    setInterval(fetchShuttleETA, 30000); // 30 秒更新 Shuttle 到站時間

    // 初始化執行
    fetchDashboardData();
    fetchKmbETA();
    fetchShuttleETA();
  </script>
</body>
</html>

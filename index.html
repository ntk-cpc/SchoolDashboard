<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>教師儀表板</title>
  <style>
    :root {
      --bg-color: #0d1117;
      --card-bg: #161b22;
      --card-border: #30363d;
      --text-primary: #c9d1d9;
      --text-secondary: #8b949e;
      --accent-blue: #58a6ff;
      --accent-cyan: #39c5bb;
      --accent-purple: #bc8cff;
      --accent-pink: #f778ba;
      --accent-yellow: #d29922;
      --tag-bg: #21262d;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-primary);
      padding: 12px;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* 頂部 Header */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      padding: 0 4px;
    }

    .header-left {
      display: flex;
      flex-direction: column;
    }

    .title {
      font-size: 1.1rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .time-stamp {
      font-size: 0.75rem;
      color: var(--text-secondary);
      margin-top: 2px;
    }

    .header-right {
      display: flex;
      gap: 8px;
    }

    .status-badge {
      background-color: var(--tag-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 4px 10px;
      font-size: 0.75rem;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .badge-val {
      color: var(--accent-yellow);
      font-weight: 600;
    }

    /* 主體 Layout */
    .dashboard-container {
      display: grid;
      grid-template-columns: 320px 1fr 340px;
      gap: 12px;
      flex: 1;
      min-height: 0;
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .card-header {
      padding: 10px 12px;
      font-size: 0.95rem;
      font-weight: 600;
      border-bottom: 1px solid var(--card-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .card-body {
      padding: 12px;
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* 左欄：課表表格 */
    .schedule-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.8rem;
    }

    .schedule-table th {
      color: var(--text-secondary);
      font-weight: 400;
      text-align: left;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--card-border);
    }

    .schedule-table td {
      padding: 6px 0;
      border-bottom: 1px solid rgba(48, 54, 61, 0.4);
    }

    .schedule-table td.time-col {
      color: var(--accent-cyan);
    }

    /* 中欄：4個事務區塊 */
    .task-section-title {
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .task-section-title.hw { color: var(--accent-blue); }
    .task-section-title.dl { color: var(--accent-yellow); }
    .task-section-title.act { color: var(--accent-cyan); }
    .task-section-title.mtg { color: var(--accent-pink); }

    .task-box {
      background: rgba(255, 255, 255, 0.02);
      border-left: 3px solid var(--card-border);
      border-radius: 0 4px 4px 0;
      padding: 8px 10px;
      margin-bottom: 6px;
      font-size: 0.82rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .task-box.hw-border { border-left-color: var(--accent-blue); }
    .task-box.dl-border { border-left-color: var(--accent-yellow); }
    .task-box.act-border { border-left-color: var(--accent-cyan); }
    .task-box.mtg-border { border-left-color: var(--accent-pink); }

    .task-text {
      color: var(--text-primary);
    }

    .task-subtext {
      color: var(--text-secondary);
      font-size: 0.75rem;
    }

    .empty-text {
      font-size: 0.78rem;
      color: var(--text-secondary);
      padding: 4px 0;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="header-left">
      <div class="title">🏫 教師儀表板</div>
      <div class="time-stamp" id="clock">--/--/---- --:--:--</div>
    </div>
    <div class="header-right">
      <div class="status-badge">Cycle: <span class="badge-val" id="cycle-val">-</span></div>
      <div class="status-badge">模式: <span class="badge-val" id="mode-val">-</span></div>
      <div class="status-badge">活動: <span class="badge-val" id="note-val">-</span></div>
    </div>
  </div>

  <div class="dashboard-container">
    <!-- 左：今日課表 -->
    <div class="card">
      <div class="card-header">
        <span>📅 今日課表</span>
      </div>
      <div class="card-body" style="padding: 10px;">
        <table class="schedule-table">
          <thead>
            <tr>
              <th width="15%">節</th>
              <th width="35%">時間</th>
              <th width="50%">課堂資訊</th>
            </tr>
          </thead>
          <tbody id="schedule-list">
            <tr><td colspan="3" class="empty-text">資料載入中...</td></tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- 中：今日事務 -->
    <div class="card">
      <div class="card-header">
        <span>📋 今日事務</span>
      </div>
      <div class="card-body">
        
        <!-- 功課 -->
        <div>
          <div class="task-section-title hw">📚 功課</div>
          <div id="homework-container"></div>
        </div>

        <!-- 文件 Deadline -->
        <div>
          <div class="task-section-title dl">⏳ 文件 Deadline</div>
          <div id="deadline-container"></div>
        </div>

        <!-- 學生活動/課後安排 -->
        <div>
          <div class="task-section-title act">🎨 學生活動 / 課後安排</div>
          <div id="activity-container"></div>
        </div>

        <!-- 今日會議 -->
        <div>
          <div class="task-section-title mtg">📌 今日會議</div>
          <div id="meeting-container"></div>
        </div>

      </div>
    </div>

    <!-- 右：屋苑穿梭巴士 (穿梭巴士連結修正) -->
    <div class="card">
      <div class="card-header">
        <span>🚌 屋苑穿梭巴士</span>
      </div>
      <div class="card-body" style="padding: 0;">
        <iframe src="https://ntk-cpc.github.io/SchoolDashboard/" title="Bus Schedule"></iframe>
      </div>
    </div>
  </div>

  <script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycbzaSYbTxYTftHNPO_11NnE49uTyf1tlJ1iquI7SaRhqdgjMzVYZc6SLYbL5TdBWK5x3/exec";

    // 時鐘更新
    function startClock() {
      const update = () => {
        const now = new Date();
        document.getElementById('clock').innerText = now.toLocaleString('zh-HK', {
          year: 'numeric', month: '2-digit', day: '2-digit',
          hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false
        });
      };
      update();
      setInterval(update, 1000);
    }

    async function loadDashboard() {
      try {
        const res = await fetch(GAS_URL);
        const data = await res.json();

        if (data.error) {
          console.error("GAS 錯誤:", data.error);
          return;
        }

        // 頂部資訊
        document.getElementById('cycle-val').innerText = data.cycleDay || '-';
        document.getElementById('mode-val').innerText = data.mode || '-';
        document.getElementById('note-val').innerText = data.note || '無特別活動';

        // 渲染課表
        const schedBody = document.getElementById('schedule-list');
        if (data.schedule && data.schedule.length > 0) {
          schedBody.innerHTML = data.schedule.map(s => `
            <tr>
              <td><strong>${s.period}</strong></td>
              <td class="time-col">${s.time}</td>
              <td>${s.info}</td>
            </tr>
          `).join('');
        } else {
          schedBody.innerHTML = `<tr><td colspan="3" class="empty-text">今日無課表資料</td></tr>`;
        }

        // 1. 功課
        renderSection('homework-container', data.homework, item => `
          <div class="task-box hw-border">
            <span class="task-text">${item.className ? `[${item.className}] ` : ''}${item.title}</span>
            <span class="task-subtext">${item.type || ''}</span>
          </div>
        `, '今日無功課紀錄');

        // 2. 文件 Deadline
        renderSection('deadline-container', data.deadlines, item => `
          <div class="task-box dl-border">
            <span class="task-text">${item.item}</span>
            <span class="task-subtext">${item.dept ? `${item.dept} ` : ''}${item.status ? `(${item.status})` : ''}</span>
          </div>
        `, '今日無文件截止需求');

        // 3. 學生活動
        renderSection('activity-container', data.activities, item => {
          const time = [item.start, item.end].filter(Boolean).join(' - ');
          return `
            <div class="task-box act-border">
              <span class="task-text">${item.title} ${item.location ? `<span class="task-subtext">(${item.location})</span>` : ''}</span>
              <span class="task-subtext">${time}</span>
            </div>
          `;
        }, '今日無學生活動');

        // 4. 今日會議
        renderSection('meeting-container', data.meetings, item => {
          const time = [item.start, item.end].filter(Boolean).join(' - ');
          return `
            <div class="task-box mtg-border">
              <span class="task-text">${item.title} ${item.remark ? `<span class="task-subtext">(${item.remark})</span>` : ''}</span>
              <span class="task-subtext">${time}</span>
            </div>
          `;
        }, '今日無突發會議');

      } catch (err) {
        console.error("載入資料失敗:", err);
      }
    }

    function renderSection(elementId, items, htmlFn, emptyMsg) {
      const el = document.getElementById(elementId);
      if (items && items.length > 0) {
        el.innerHTML = items.map(htmlFn).join('');
      } else {
        el.innerHTML = `<div class="empty-text">${emptyMsg}</div>`;
      }
    }

    startClock();
    loadDashboard();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>教師儀表板</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      padding: 16px;
      min-height: 100vh;
    }
    
    .top-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    .top-header h1 { font-size: 1.25rem; font-weight: 600; }
    .top-header .time-text { font-size: 0.85rem; color: #94a3b8; margin-top: 4px; }
    .top-tags { display: flex; gap: 8px; }
    .top-tag {
      background: #1e293b;
      border: 1px solid #334155;
      padding: 4px 12px;
      border-radius: 16px;
      font-size: 0.8rem;
      color: #94a3b8;
    }
    .top-tag span { color: #fbbf24; font-weight: 600; margin-left: 4px; }

    .main-layout {
      display: grid;
      grid-template-columns: 320px 1fr 380px;
      gap: 16px;
      height: calc(100vh - 80px);
    }

    .card-panel {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .panel-title {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid #334155;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .panel-body {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* 課表專用 */
    .schedule-table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
    .schedule-table th { text-align: left; padding: 6px; color: #94a3b8; border-bottom: 1px solid #334155; }
    .schedule-table td { padding: 8px 6px; border-bottom: 1px solid rgba(51, 65, 85, 0.5); }
    .schedule-table td.time { color: #38bdf8; }

    /* 中間 4 項事務 */
    .section-group { display: flex; flex-direction: column; gap: 8px; }
    .section-label { font-size: 0.9rem; font-weight: 600; display: flex; align-items: center; gap: 6px; }
    
    .label-hw { color: #38bdf8; }
    .label-dl { color: #fbbf24; }
    .label-act { color: #38bdf8; }
    .label-mtg { color: #f472b6; }

    .data-box {
      background: rgba(15, 23, 42, 0.6);
      border-left: 4px solid #334155;
      border-radius: 0 6px 6px 0;
      padding: 10px 12px;
      font-size: 0.85rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .data-box.hw { border-left-color: #38bdf8; }
    .data-box.dl { border-left-color: #fbbf24; }
    .data-box.act { border-left-color: #38bdf8; }
    .data-box.mtg { border-left-color: #f472b6; }

    .data-title { font-weight: 500; color: #f8fafc; }
    .data-sub { font-size: 0.8rem; color: #38bdf8; }
    .data-empty { font-size: 0.85rem; color: #64748b; font-style: italic; padding: 4px 0; }

    iframe { width: 100%; height: 100%; border: none; border-radius: 6px; }
  </style>
</head>
<body>

  <div class="top-header">
    <div>
      <h1>🏫 教師儀表板</h1>
      <div class="time-text" id="live-time">03/09/2026 15:50:54</div>
    </div>
    <div class="top-tags">
      <div class="top-tag">Cycle: <span id="tag-cycle">-</span></div>
      <div class="top-tag">模式: <span id="tag-mode">-</span></div>
      <div class="top-tag">活動: <span id="tag-note">-</span></div>
    </div>
  </div>

  <div class="main-layout">
    <!-- 左欄：今日課表 -->
    <div class="card-panel">
      <div class="panel-title">📅 今日課表</div>
      <div class="panel-body">
        <table class="schedule-table">
          <thead>
            <tr>
              <th width="15%">節</th>
              <th width="35%">時間</th>
              <th width="50%">課堂資訊</th>
            </tr>
          </thead>
          <tbody id="schedule-rows">
            <tr><td colspan="3" class="data-empty">資料載入中...</td></tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- 中欄：今日事務 -->
    <div class="card-panel">
      <div class="panel-title">📋 今日事務</div>
      <div class="panel-body">
        
        <!-- 1. 功課 -->
        <div class="section-group">
          <div class="section-label label-hw">📚 功課</div>
          <div id="hw-list"></div>
        </div>

        <!-- 2. 文件 Deadline -->
        <div class="section-group">
          <div class="section-label label-dl">⏳ 文件 Deadline</div>
          <div id="dl-list"></div>
        </div>

        <!-- 3. 學生活動/課後安排 -->
        <div class="section-group">
          <div class="section-label label-act">🎨 學生活動/課後安排</div>
          <div id="act-list"></div>
        </div>

        <!-- 4. 今日會議 -->
        <div class="section-group">
          <div class="section-label label-mtg">📌 今日會議</div>
          <div id="mtg-list"></div>
        </div>

      </div>
    </div>

    <!-- 右欄：屋苑穿梭巴士 -->
    <div class="card-panel">
      <div class="panel-title">🚌 屋苑穿梭巴士</div>
      <div class="panel-body" style="padding: 0;">
        <iframe src="https://ntk-cpc.github.io/shuttle-bus-widget/" title="Shuttle Bus"></iframe>
      </div>
    </div>
  </div>

  <script>
    // 綁定最新的 Google Apps Script API 網址
    const GAS_URL = "https://script.google.com/macros/s/AKfycbzaSYbTxYTftHNPO_11NnE49uTyf1tlJ1iquI7SaRhqdgjMzVYZc6SLYbL5TdBWK5x3/exec";

    function updateClock() {
      const now = new Date();
      document.getElementById('live-time').innerText = now.toLocaleString('zh-HK', {
        year: 'numeric', month: '2-digit', day: '2-digit',
        hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false
      });
    }
    setInterval(updateClock, 1000);
    updateClock();

    async function loadData() {
      try {
        const response = await fetch(GAS_URL);
        const data = await response.json();

        if (data.error) {
          console.error("GAS 錯誤:", data.error);
          return;
        }

        // 1. 頂部狀態列
        document.getElementById('tag-cycle').innerText = data.cycleDay || '-';
        document.getElementById('tag-mode').innerText = data.mode || '-';
        document.getElementById('tag-note').innerText = data.note || '無特別活動';

        // 2. 左側：今日課表
        const schedTbody = document.getElementById('schedule-rows');
        if (data.schedule && data.schedule.length > 0) {
          schedTbody.innerHTML = data.schedule.map(item => `
            <tr>
              <td><strong>${item.period}</strong></td>
              <td class="time">${item.time}</td>
              <td>${item.info}</td>
            </tr>
          `).join('');
        } else {
          schedTbody.innerHTML = `<tr><td colspan="3" class="data-empty">今日無課表資料</td></tr>`;
        }

        // 3. 中間 1：功課
        renderSection('hw-list', data.homework, item => `
          <div class="data-box hw">
            <span class="data-title">${item.className ? `[${item.className}] ` : ''}${item.title}</span>
            <span class="data-sub">${item.type || ''}</span>
          </div>
        `, '今日無功課紀錄');

        // 4. 中間 2：文件 Deadline
        renderSection('dl-list', data.deadlines, item => `
          <div class="data-box dl">
            <span class="data-title">${item.item}</span>
            <span class="data-sub">${item.dept ? `${item.dept} ` : ''}${item.status ? `(${item.status})` : ''}</span>
          </div>
        `, '今日無文件截止需求');

        // 5. 中間 3：學生活動 / 課後安排 (修正解析欄位)
        renderSection('act-list', data.activities, item => {
          const timeRange = [item.start, item.end].filter(Boolean).join(' - ');
          const loc = item.location ? ` (${item.location})` : '';
          return `
            <div class="data-box act">
              <span class="data-title">${item.title}${loc}</span>
              <span class="data-sub">${timeRange}</span>
            </div>
          `;
        }, '今日無學生活動');

        // 6. 中間 4：今日會議 (修正解析欄位)
        renderSection('mtg-list', data.meetings, item => {
          const timeRange = [item.start, item.end].filter(Boolean).join(' - ');
          const remark = item.remark ? ` (${item.remark})` : '';
          return `
            <div class="data-box mtg">
              <span class="data-title">${item.title}${remark}</span>
              <span class="data-sub">${timeRange}</span>
            </div>
          `;
        }, '今日無突發會議');

      } catch (err) {
        console.error("讀取資料失敗:", err);
      }
    }

    function renderSection(containerId, list, templateFunc, emptyMessage) {
      const container = document.getElementById(containerId);
      if (list && list.length > 0) {
        container.innerHTML = list.map(templateFunc).join('');
      } else {
        container.innerHTML = `<div class="data-empty">${emptyMessage}</div>`;
      }
    }

    loadData();
  </script>
</body>
</html>

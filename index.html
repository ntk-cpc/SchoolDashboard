<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>教師儀表板</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --accent-blue: #38bdf8;
      --accent-purple: #c084fc;
      --accent-pink: #f472b6;
      --accent-yellow: #fbbf24;
      --border-color: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 16px;
      min-height: 100vh;
    }

    /* 頂部列 */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      padding: 0 8px;
    }

    .title-area h1 {
      font-size: 1.25rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .time-display {
      font-size: 0.85rem;
      color: var(--text-sub);
      margin-top: 4px;
    }

    .status-tags {
      display: flex;
      gap: 12px;
    }

    .tag {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .tag-val {
      color: var(--accent-yellow);
      font-weight: 600;
    }

    /* 主要版面 grid */
    .dashboard-grid {
      display: grid;
      grid-template-columns: 320px 1fr 360px;
      gap: 16px;
      height: calc(100vh - 80px);
    }

    @media (max-width: 1200px) {
      .dashboard-grid {
        grid-template-columns: 1fr;
        height: auto;
      }
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .card-header {
      font-size: 1.05rem;
      font-weight: 600;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border-color);
    }

    .card-content {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* 列表項目通用樣式 */
    .section-title {
      font-size: 0.9rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 8px;
    }

    .section-1 { color: var(--accent-blue); }
    .section-2 { color: var(--accent-yellow); }
    .section-3 { color: var(--accent-pink); }
    .section-4 { color: var(--accent-purple); }

    .item-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 12px;
    }

    .item-row {
      background: rgba(255, 255, 255, 0.03);
      border-left: 3px solid var(--border-color);
      padding: 8px 12px;
      border-radius: 0 6px 6px 0;
      font-size: 0.88rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .item-row.blue { border-left-color: var(--accent-blue); }
    .item-row.yellow { border-left-color: var(--accent-yellow); }
    .item-row.pink { border-left-color: var(--accent-pink); }
    .item-row.purple { border-left-color: var(--accent-purple); }

    .item-main {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .item-tag {
      font-size: 0.75rem;
      padding: 2px 6px;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.1);
      color: var(--text-sub);
    }

    .item-sub {
      font-size: 0.8rem;
      color: var(--text-sub);
    }

    .empty-msg {
      font-size: 0.85rem;
      color: var(--text-sub);
      font-style: italic;
      padding: 6px 0;
    }

    /* 課表專用表格 */
    .schedule-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.85rem;
    }

    .schedule-table th, .schedule-table td {
      padding: 8px;
      text-align: left;
    }

    .schedule-table th {
      color: var(--text-sub);
      font-weight: 500;
      border-bottom: 1px solid var(--border-color);
    }

    .schedule-table tr:nth-child(even) {
      background: rgba(255, 255, 255, 0.02);
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      border-radius: 8px;
    }
  </style>
</head>
<body>

  <div class="top-bar">
    <div class="title-area">
      <h1>🏫 教師儀表板</h1>
      <div class="time-display" id="current-time">載入時間中...</div>
    </div>
    <div class="status-tags">
      <div class="tag">Cycle: <span class="tag-val" id="cycle-val">-</span></div>
      <div class="tag">模式: <span class="tag-val" id="mode-val">-</span></div>
      <div class="tag">活動: <span class="tag-val" id="note-val">-</span></div>
    </div>
  </div>

  <div class="dashboard-grid">
    <!-- 左欄：今日課表 -->
    <div class="card">
      <div class="card-header">📅 今日課表</div>
      <div class="card-content">
        <table class="schedule-table">
          <thead>
            <tr>
              <th width="15%">節</th>
              <th width="35%">時間</th>
              <th width="50%">課堂資訊</th>
            </tr>
          </thead>
          <tbody id="schedule-tbody">
            <tr><td colspan="3" class="empty-msg">資料載入中...</td></tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- 中欄：今日事務 (4項) -->
    <div class="card">
      <div class="card-header">📋 今日事務</div>
      <div class="card-content">
        
        <!-- 1. 功課 -->
        <div>
          <div class="section-title section-1">📚 功課</div>
          <div id="homework-list" class="item-list"></div>
        </div>

        <!-- 2. 文件 Deadline -->
        <div>
          <div class="section-title section-2">⏳ 文件 Deadline</div>
          <div id="deadline-list" class="item-list"></div>
        </div>

        <!-- 3. 學生活動 / 課後安排 -->
        <div>
          <div class="section-title section-3">🎨 學生活動 / 課後安排</div>
          <div id="activity-list" class="item-list"></div>
        </div>

        <!-- 4. 今日會議 -->
        <div>
          <div class="section-title section-4">📌 今日會議</div>
          <div id="meeting-list" class="item-list"></div>
        </div>

      </div>
    </div>

    <!-- 右欄：屋苑穿梭巴士或其他嵌頁 -->
    <div class="card">
      <div class="card-header">🚌 屋苑穿梭巴士</div>
      <div class="card-content" style="padding: 0;">
        <iframe src="https://ntk-cpc.github.io/shuttle-bus-widget/" title="Shuttle Bus"></iframe>
      </div>
    </div>
  </div>

  <script>
    // 直接更新為最新的 Apps Script API 網址
    const API_URL = "https://script.google.com/macros/s/AKfycbzaSYbTxYTftHNPO_11NnE49uTyf1tlJ1iquI7SaRhqdgjMzVYZc6SLYbL5TdBWK5x3/exec";

    function updateTime() {
      const now = new Date();
      document.getElementById('current-time').innerText = now.toLocaleString('zh-HK', {
        year: 'numeric', month: '2-digit', day: '2-digit',
        hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false
      });
    }
    setInterval(updateTime, 1000);
    updateTime();

    async function fetchData() {
      try {
        const res = await fetch(API_URL);
        const data = await res.json();

        if (data.error) {
          console.error("API Error:", data.error);
          return;
        }

        // 1. 更新頂部狀態
        document.getElementById('cycle-val').innerText = data.cycleDay || '-';
        document.getElementById('mode-val').innerText = data.mode || '-';
        document.getElementById('note-val').innerText = data.note || '無特別活動';

        // 2. 渲染課表
        const schedBody = document.getElementById('schedule-tbody');
        if (data.schedule && data.schedule.length > 0) {
          schedBody.innerHTML = data.schedule.map(s => `
            <tr>
              <td><strong>${s.period}</strong></td>
              <td style="color: var(--text-sub);">${s.time}</td>
              <td>${s.info}</td>
            </tr>
          `).join('');
        } else {
          schedBody.innerHTML = `<tr><td colspan="3" class="empty-msg">今日無課表資料</td></tr>`;
        }

        // 3. 渲染功課
        renderList('homework-list', data.homework, item => `
          <div class="item-row blue">
            <div class="item-main">
              ${item.className ? `<span class="item-tag">${item.className}</span>` : ''}
              <span>${item.title}</span>
            </div>
            ${item.type ? `<span class="item-sub">${item.type}</span>` : ''}
          </div>
        `, '今日無功課紀錄');

        // 4. 渲染文件 Deadline
        renderList('deadline-list', data.deadlines, item => `
          <div class="item-row yellow">
            <div class="item-main">
              ${item.dept ? `<span class="item-tag">${item.dept}</span>` : ''}
              <span>${item.item}</span>
            </div>
            ${item.status ? `<span class="item-sub">${item.status}</span>` : ''}
          </div>
        `, '今日無文件截止需求');

        // 5. 渲染學生活動 / 課後安排
        renderList('activity-list', data.activities, item => {
          const timeStr = [item.start, item.end].filter(Boolean).join(' - ');
          return `
            <div class="item-row pink">
              <div class="item-main">
                <span>${item.title}</span>
                ${item.location ? `<span class="item-sub">(${item.location})</span>` : ''}
              </div>
              <span class="item-sub">${timeStr}</span>
            </div>
          `;
        }, '今日無學生活動');

        // 6. 渲染今日會議
        renderList('meeting-list', data.meetings, item => {
          const timeStr = [item.start, item.end].filter(Boolean).join(' - ');
          return `
            <div class="item-row purple">
              <div class="item-main">
                <span>${item.title}</span>
                ${item.remark ? `<span class="item-sub">(${item.remark})</span>` : ''}
              </div>
              <span class="item-sub">${timeStr}</span>
            </div>
          `;
        }, '今日無突發會議');

      } catch (err) {
        console.error("Fetch Error:", err);
      }
    }

    function renderList(elementId, items, templateFn, emptyMsg) {
      const container = document.getElementById(elementId);
      if (items && items.length > 0) {
        container.innerHTML = items.map(templateFn).join('');
      } else {
        container.innerHTML = `<div class="empty-msg">${emptyMsg}</div>`;
      }
    }

    fetchData();
  </script>
</body>
</html>
